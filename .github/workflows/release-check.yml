name: Release checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
        env:
          NAVER_MAP_CLIENT_ID: e2e-placeholder
          OPENAI_UPDATE_ENABLED: 'false'
